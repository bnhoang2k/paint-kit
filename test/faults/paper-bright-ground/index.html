<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paint-kit fault paper-bright-ground</title>
<!-- PLANTED FAULT (paper-bright-ground: a ground near the ink's lightness under the body text). A copy of
     test/pages/paper.html with exactly one change: a shape field puts material slot 1 under the paragraph, and slot 1
     is paper-like with its ground pulled 70% toward the ink token (brighter under the light ink in dark mode, darker
     under the dark ink in light mode). Only text-contrast must newly fail, on the "lit" paragraph. -->
<style>
  :root {
    --ground: oklch(0.94 0.015 85);
    --ink: oklch(0.24 0.03 260);
    --accent: oklch(0.68 0.12 60);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.26 0.015 260);
      --ink: oklch(0.92 0.02 85);
      --accent: oklch(0.74 0.11 60);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  main { position: relative; max-width: 34rem; padding: 40px 32px; }
  h1 { margin: 0 0 20px; font: 600 40px/1.15 Georgia, "Times New Roman", serif; letter-spacing: -0.01em; }
  p { margin: 0; font: 400 19px/1.55 Georgia, "Times New Roman", serif; letter-spacing: 0.01em; }
</style>
<script type="importmap">{"imports":{"paint-kit":"/dist/src/engine/index.js"}}</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<main>
  <h1 data-paint-ink data-paint-text="always">Night shift notes</h1>
  <p data-paint-ink data-paint-text="lit">The lamp on the rail decides what you can read. Words inside its pool sit
    sharp and black in the paper's fibres; words outside it sink back into the dark sheet until the light
    slides over them again. Move the lamp and the page reads differently.</p>
</main>
<script type="module">
  import { paint, fields, materials, lights, fromPage } from "paint-kit";

  paint(document.querySelector("canvas"), {
    seed: 1,
    detail: 0.6,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--accent"] }),
    fields: [
      fields.sheet({ warp: 0.35 }),
      fields.text(),
      // Slot 1 over the paragraph's place at 960 x 600 (uv y is up).
      fields.shape({
        writes: ["slot"],
        glsl: "vec4 field(vec2 uv, vec2 q) { bool on = uv.x > 0.02 && uv.x < 0.62 && uv.y > 0.61 && uv.y < 0.84; return vec4(0.0, 1.0, 0.0, on ? 1.0 : -1.0); }",
      }),
    ],
    materials: [
      materials.paper(),
      {
        id: "nearink",
        laws: ["relief"],
        uniforms: {},
        glsl: "MatOut mat_$(Surf s) { MatOut m = matBase(s); m.albedo = mixOklab(uGround, uInk, 0.7); m.wrap = 0.35; return printInk(m, s, 0.0, vec2(1.0, 0.0)); }",
      },
    ],
    lights: [
      lights.lamp({ at: [0.2, -0.05, 0.8], aim: [0.22, 0.3, 0], cone: 22, soft: 8, level: 1.15, kelvin: 2900 }),
      lights.ambient(0.3),
    ],
  });
</script>
</body>
</html>
