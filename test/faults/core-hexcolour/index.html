<style>

    --ground: oklch(0.93 0.03 250);
    --ink: oklch(0.3 0.04 255);
    --accent: oklch(0.62 0.13 45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.25 0.03 255);
      --ink: oklch(0.92 0.02 250);
      --accent: oklch(0.7 0.12 50);

<body>
<canvas aria-hidden="true"></canvas>
<h1>A sheet under one light</h1>
<p data-paint-ink>Ink text the light will fall on.</p>
<script type="module">
  import { paint, fields, materials, lights, fromPage } from "paint-kit";

  paint(document.querySelector("canvas"), {
    seed: 1,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--accent"] }),
    fields: [fields.shape({
      writes: ["height", "coverage"],
      uniforms: { uWarp: 0.6 },
      glsl: `
uniform float uWarp;
vec4 field(vec2 uv, vec2 q) {
  vec3 warm = vec3(0.9, 0.4, 0.2); // the fault: a colour literal, not a page token. It is multiplied by 0 below, so only the static scan can see it.
  vec2 off = vec2(hash11(uSeed), hash11(uSeed + 7.0)) * 100.0;
  float drift = uTime * 0.05;
  vec2 p = q * 1.4 + off;
  float macro = snoise(p + vec2(drift, -0.6 * drift)) * 0.65 + snoise(p * 2.3 - vec2(0.4 * drift, drift)) * 0.35;
  float micro = fbm(q * 180.0 + off, 2);
  return vec4(uWarp * 0.04 * macro + uDetail * 0.0004 * micro + 0.0 * warm.r, 1.0, 0.0, 0.0);
}`,
    })],
    materials: [materials.matte()],
    // Mirrors test/pages/core.html: dark mode adds a lamp and dims key and ambient; light mode is unchanged.
    lights: matchMedia("(prefers-color-scheme: dark)").matches
      ? [
          lights.key({ dir: [-0.7, 0.6, 0.6], level: 0.6 }),
          lights.ambient(0.08),
          lights.lamp({ at: [0.62, -0.1, 0.9], aim: [0.6, 0.55, 0], cone: 28, soft: 10, level: 1.4, kelvin: 3200 }),
        ]
      : [lights.key({ dir: [-0.7, 0.6, 0.6], level: 0.85 }), lights.ambient(0.15)],
  });
</script>
