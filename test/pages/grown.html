<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paint-kit grown</title>
<!-- The grown test page: a reaction-diffusion relief (the grown field) on the paper material, lit by a key from the
     upper left (light 0) and ambient (light 1). No text. The seed picks the family (seed mod 4: coral, cells,
     worms, spots), so seeds 1 to 3 show cells, worms and spots. test/pages/grown.test.ts drives it. -->
<style>
  :root {
    --ground: oklch(0.94 0.015 85);
    --ink: oklch(0.24 0.03 260);
    --accent: oklch(0.68 0.12 60);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.26 0.015 260);
      --ink: oklch(0.92 0.02 85);
      --accent: oklch(0.74 0.11 60);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<script type="importmap">{"imports":{"paint-kit":"/dist/src/engine/index.js"}}</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<script type="module">
  import { paint, fields, materials, lights, fromPage } from "paint-kit";

  window.painter = paint(document.querySelector("canvas"), {
    seed: 1,
    detail: 0.6,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--accent"] }),
    fields: [fields.reactionDiffusion()],
    materials: [materials.paper()],
    lights: [lights.key({ dir: [-0.45, 0.55, 0.7], level: 0.85 }), lights.ambient(0.35)],
  });
</script>
</body>
</html>
