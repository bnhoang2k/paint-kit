<html lang="en">
<head>

<title>paint-kit core</title>
<!-- PLANTED FAULT (core-nocompile: the field's GLSL uses an identifier that is not defined, so the shader fails to compile).
     A copy of test/pages/core.html with exactly one change; only render should fail on it.
     The engine core's test page: one sheet with a gentle warp, matte, a key light from the upper left and
     ambient. The tokens below are this page's palette, for light and dark. -->
<style>
  :root {
    --ground: oklch(0.93 0.03 250);
    --ink: oklch(0.3 0.04 255);
    --accent: oklch(0.62 0.13 45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.25 0.03 255);
      --ink: oklch(0.92 0.02 250);
      --accent: oklch(0.7 0.12 50);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  h1 { position: relative; margin: 0; padding: 48px 48px 12px; font: 600 40px/1.2 system-ui, sans-serif; }
  p { position: relative; margin: 0; padding: 0 48px; font: 400 18px/1.4 system-ui, sans-serif; }
</style>
<script type="importmap">{"imports":{"paint-kit":"/dist/src/engine/index.js"}}</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<h1>A sheet under one light</h1>
<p data-paint-ink>Ink text the light will fall on.</p>
<script type="module">
  import { paint, fields, materials, lights, fromPage } from "paint-kit";

  paint(document.querySelector("canvas"), {
    seed: 1,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--accent"] }),
    fields: [fields.shape({
      writes: ["height", "coverage"],
      glsl: `
vec4 field(vec2 uv, vec2 q) {
  return vec4(notDeclaredAnywhere * 0.01, 1.0, 0.0, 0.0); // the fault: undefined identifier
}`,
    })],
    materials: [materials.matte()],
    // Mirrors test/pages/core.html: dark mode adds a lamp and dims key and ambient; light mode is unchanged.
    lights: matchMedia("(prefers-color-scheme: dark)").matches
      ? [
          lights.key({ dir: [-0.7, 0.6, 0.6], level: 0.6 }),
          lights.ambient(0.08),
          lights.lamp({ at: [0.62, -0.1, 0.9], aim: [0.6, 0.55, 0], cone: 28, soft: 10, level: 1.4, kelvin: 3200 }),
        ]
      : [lights.key({ dir: [-0.7, 0.6, 0.6], level: 0.85 }), lights.ambient(0.15)],
  });
</script>
</body>
