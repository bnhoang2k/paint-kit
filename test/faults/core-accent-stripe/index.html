<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paint-kit core</title>
<!-- PLANTED FAULT (core-accent-stripe: a band of 15% of the frame, glazed with an accent read once and kept). A copy
     of test/pages/core.html with exactly one change: a horizontal band (a shape field writing material slot 1) whose
     material mixes 70% of an accent colour copied into a uniform at start, the way bar code that reads a token
     once would, over 30% of the live accent. The rest of the frame follows its tokens, so the whole-frame mean
     falls far; palette must fail it by its per-token half (the accent, judged on its own pixels, falls about a
     third of the way), its static half finds no colour literal, and nothing else may end worse than on core.html
     (test/pages/checks-basic.test.ts). -->
<!-- The engine core's test page: one sheet with a gentle warp, matte, a key light from the upper left and
     ambient (in dark mode also a lamp; see the script). The tokens below are this page's palette, for light and dark. -->
<style>
  :root {
    --ground: oklch(0.93 0.03 250);
    --ink: oklch(0.3 0.04 255);
    --accent: oklch(0.62 0.13 45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.25 0.03 255);
      --ink: oklch(0.92 0.02 250);
      --accent: oklch(0.7 0.12 50);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  h1 { position: relative; margin: 0; padding: 48px 48px 12px; font: 600 40px/1.2 system-ui, sans-serif; }
  p { position: relative; margin: 0; padding: 0 48px; font: 400 18px/1.4 system-ui, sans-serif; }
</style>
<script type="importmap">{"imports":{"paint-kit":"/dist/src/engine/index.js"}}</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<h1>A sheet under one light</h1>
<p data-paint-ink>Ink text the light will fall on.</p>
<script type="module">
  import { paint, fields, materials, lights, fromPage, parseCssColor } from "paint-kit";

  // The fault: the accent as the browser paints it, read once here and never again.
  const probe = document.createElement("span");
  probe.style.color = "var(--accent)";
  document.body.append(probe);
  const bakedAccent = parseCssColor(getComputedStyle(probe).color);
  probe.remove();
  const BAND_HALF = 0.075; // of the sheet's height: the band is 15% of the frame
  const band = fields.shape({
    writes: ["slot"],
    uniforms: { uBandHalf: BAND_HALF },
    glsl: /* glsl */ `
uniform float uBandHalf;
vec4 field(vec2 uv, vec2 q) { return abs(uv.y - 0.5) < uBandHalf ? vec4(0.0, 1.0, 0.0, 1.0) : vec4(0.0, 1.0, 0.0, -1.0); }
`,
  });
  const glaze = {
    id: "glaze",
    laws: ["relief"],
    uniforms: { baked: bakedAccent },
    glsl: /* glsl */ `
uniform vec3 u_$_baked;
MatOut mat_$(Surf s) {
  MatOut m = matBase(s);
  m.albedo = mixOklab(uRamp[2], u_$_baked, 0.7);
  return m;
}
`,
  };

  // Dark mode lights the sheet as a night scene: a dimmer key and ambient plus a lamp, so the dark page keeps
  // real light structure (under key and ambient alone its luminance range was 0.043, as flat as the mud fault).
  // Light mode is unchanged. The key stays light 0 in both, for the checks' moveLight.
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const lightsFor = (night) =>
    night
      ? [
          lights.key({ dir: [-0.7, 0.6, 0.6], level: 0.6 }),
          lights.ambient(0.08),
          lights.lamp({ at: [0.62, -0.1, 0.9], aim: [0.6, 0.55, 0], cone: 28, soft: 10, level: 1.4, kelvin: 3200 }),
        ]
      : [lights.key({ dir: [-0.7, 0.6, 0.6], level: 0.85 }), lights.ambient(0.15)];
  const painter = paint(document.querySelector("canvas"), {
    seed: 1,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--accent"] }),
    fields: [fields.sheet({ warp: 0.6 }), band],
    materials: [materials.matte(), glaze],
    lights: lightsFor(dark.matches),
  });
  dark.addEventListener("change", () => painter.set({ lights: lightsFor(dark.matches) }));
</script>
</body>
</html>
