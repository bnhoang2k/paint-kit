<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paint-kit tone at a stop</title>
<!-- Surface tone at a stop (Phase 2 Task 6 fix round 1): test/pages/tone.html's desk alone, matte at tone 0.25,
     which with one accent is ramp stop 1 exactly. The desk's relief is macro only (a slow warp, the same at every
     detail), unlike fields.sheet, whose micro relief rises with the dial: so the only fine structure the dial can add
     here is the matte's own colour variation. It must still reach the surface: the variation is relative to the
     tone, never toward a fixed stop the tone may sit on. tone.test.ts runs the detail check on it. -->
<style>
  :root {
    --ground: oklch(0.93 0.02 85);
    --ink: oklch(0.28 0.03 260);
    --accent: oklch(0.62 0.12 35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.25 0.02 260);
      --ink: oklch(0.92 0.02 85);
      --accent: oklch(0.68 0.11 40);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<script type="importmap">{"imports":{"paint-kit":"/dist/src/engine/index.js"}}</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<script type="module">
  import { paint, fields, materials, lights, fromPage } from "paint-kit";

  const q = new URLSearchParams(location.search);
  const seed = Number(q.get("seed") ?? 1);
  // ?tone= sets the desk's tone (default 0.25, stop 1); tone.test.ts reads ?tone=0 beside it.
  const tone = Number(q.get("tone") ?? 0.25);
  // A slow warp, 0.016 short-side units deep, with no detail term (builder's choice: macro relief the key can show).
  const desk = fields.shape({
    writes: ["height"],
    uniforms: {},
    glsl: /* glsl */ `
vec4 field(vec2 uv, vec2 q) {
  vec2 off = vec2(hash11(uSeed), hash11(uSeed + 7.0)) * 100.0;
  return vec4(0.016 * snoise(q * 1.4 + off), 1.0, 0.0, 0.0);
}
`,
  });
  paint(document.querySelector("canvas"), {
    seed,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--accent"] }),
    fields: [desk],
    materials: [materials.matte({ tone })],
    lights: [lights.key({ dir: [-0.6, 0.55, 0.65], level: 0.85 }), lights.ambient(0.2)],
  });
</script>
</body>
</html>
