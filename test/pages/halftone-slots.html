<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paint-kit halftone slots</title>
<!-- The halftone screen on some slots only (Phase 2 Task 9): a card on a desk, with the finish's halftone screen
     (`finish.halftone`) listing only the card's slot (`slots: [1]`). The desk is paper at tone 0 (slot 0) on a gently
     warped sheet; the card is matte at tone 1 (slot 1), a raised slab; a word printed on the card (`data-paint-ink`)
     is solid line art the screen leaves alone. `?all=1` leaves `slots` out (the default: every slot screened).
     Lights: a key from the upper left (light 0) and ambient (light 1), tone.html's. The screen's cell (8 CSS px),
     angle (45) and bed (0.5, the ramp's middle stop, so lit ink and the bed differ in both schemes) are the builder's
     choice for this test page. `window.setScreen(on)` turns the screen off and on, `window.__slots` holds the boxes
     the test reads (CSS px). test/pages/halftone.test.ts reads them. -->
<style>
  :root {
    --ground: oklch(0.93 0.02 85);
    --ink: oklch(0.28 0.03 260);
    --accent: oklch(0.62 0.12 35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.25 0.02 260);
      --ink: oklch(0.92 0.02 85);
      --accent: oklch(0.68 0.11 40);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .word { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0;
    font: 700 56px/1 Georgia, "Times New Roman", serif; }
</style>
<script type="importmap">{"imports":{"paint-kit":"/dist/src/engine/index.js"}}</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<p class="word" data-paint-ink>STAMP</p>
<script type="module">
  import { paint, fields, materials, lights, fromPage } from "paint-kit";

  const q = new URLSearchParams(location.search);
  const seed = Number(q.get("seed") ?? 1);
  // The card: centred, 0.72 x 0.44 short-side units with 0.03 corners, raised 0.006 with a rim over its outer 0.012
  // (tone.html's card).
  const CARD = { half: [0.36, 0.22], corner: 0.03, lift: 0.006, bevel: 0.012 };
  const card = fields.shape({
    writes: ["height", "slot"],
    uniforms: { uHalf: CARD.half, uCorner: CARD.corner, uLift: CARD.lift, uBevel: CARD.bevel },
    glsl: /* glsl */ `
uniform vec2 uHalf;
uniform float uCorner, uLift, uBevel;
float boxSd(vec2 p, vec2 b, float r) { vec2 d = abs(p) - b + r; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r; }
vec4 field(vec2 uv, vec2 q) {
  float d = boxSd(q, uHalf, uCorner);
  if (d > 0.0) return vec4(0.0, 1.0, 0.0, -1.0);
  float rim = smoothstep(-uBevel, 0.0, d);
  return vec4(uLift * (1.0 - rim * rim), 1.0, 0.0, 1.0);
}
`,
  });
  const SCREEN = q.get("all") === "1" ? { cell: 8, angle: 45, ground: 0.5 } : { cell: 8, angle: 45, ground: 0.5, slots: [1] };

  window.painter = paint(document.querySelector("canvas"), {
    seed,
    detail: 0.6,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--accent"] }),
    fields: [fields.sheet({ warp: 0.4 }), card, fields.text()],
    materials: [materials.paper({ tone: 0 }), materials.matte({ tone: 1 })],
    lights: [lights.key({ dir: [-0.6, 0.55, 0.65], level: 0.85 }), lights.ambient(0.2)],
    finish: { halftone: SCREEN },
  });
  window.setScreen = (on) => window.painter.set({ finish: { halftone: on ? SCREEN : null } });

  // Where the test reads, in CSS px of the canvas: a strip of the card above the word, the desk left of the card, and
  // the word's box.
  const box = (cx, cy, hw, hh) => {
    const side = Math.min(innerWidth, innerHeight);
    return { x: Math.round(innerWidth / 2 + (cx - hw) * side), y: Math.round(innerHeight / 2 - (cy + hh) * side), w: Math.round(2 * hw * side), h: Math.round(2 * hh * side) };
  };
  const wr = document.querySelector(".word").getBoundingClientRect();
  window.__slots = {
    card: box(0, 0.15, 0.3, 0.04),
    desk: box(-(CARD.half[0] + 0.2), 0, 0.12, 0.2),
    word: { x: Math.round(wr.left), y: Math.round(wr.top), w: Math.round(wr.width), h: Math.round(wr.height) },
  };
</script>
</body>
</html>
