<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holo sticker</title>
<!-- A holo sticker on a notebook. Copies bar 10 (foil card): its paint call (paper page, paper face, foil window,
     one key that casts, ambient, tilt plus key turn on the pointer). Changed content: the page is a ruled notebook
     page with a margin line and punched holes; the raised thing is a round die-cut sticker with a paper border and a
     foil disc whose grooves are concentric rings about a seeded centre; printed line art is a star and a ring.
     Slots: 0 the notebook page (paper, ground tone), 1 the sticker's border (paper, tone 0.25 = --sticker),
     2 the foil disc. Light 0 is the key, light 1 the ambient. Every number is in notes.md with its source. -->
<style>
  :root {
    --ground: oklch(0.95 0.015 90);
    --ink: oklch(0.32 0.07 255);
    --sticker: oklch(0.99 0.004 260);
    --accent-warm: oklch(0.70 0.13 350);
    --accent-cool: oklch(0.62 0.09 190);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.25 0.03 265);
      --ink: oklch(0.92 0.01 90);
      --sticker: oklch(0.37 0.02 265);
      --accent-warm: oklch(0.72 0.12 350);
      --accent-cool: oklch(0.64 0.08 190);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* The notebook's words, placed by layout() so each sits on a ruled line, printed into the sheet. */
  .nb-row { --u: 1; position: fixed; margin: 0; display: flex; align-items: flex-end; justify-content: space-between;
    box-sizing: border-box; padding: 0 0 calc(3px * var(--u)); }
  .nb-row p { margin: 0; white-space: nowrap; }
  .nb-title { font: 700 24px/1.1 "Trebuchet MS", "Gill Sans", sans-serif; }
  .nb-date { font: 600 13px/1.1 "Trebuchet MS", "Gill Sans", sans-serif; letter-spacing: 0.04em; }
  .nb-line { font: italic 400 16px/1.1 "Trebuchet MS", "Gill Sans", sans-serif; }
</style>
<script type="importmap">{"imports":{"paint-kit":"/dist/src/engine/index.js"}}</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<div class="nb-row nb-row-0">
  <p class="nb-title" data-paint-ink data-ui-paint-text>Field notes</p>
  <p class="nb-date" data-paint-ink data-ui-paint-text>Nov 18</p>
</div>
<div class="nb-row nb-row-1"><p class="nb-line" data-paint-ink data-ui-paint-text>Low tide at six, then rain.</p></div>
<div class="nb-row nb-row-2"><p class="nb-line" data-paint-ink data-ui-paint-text>The sticker came with the pens.</p></div>
<script type="module">
  import { paint, fields, materials, lights, fromPage, easeOfTau } from "paint-kit";

  // The sticker, in short-side units (ss) about the page centre, y up (fields.shape's q).
  const STICKER = {
    centre: [0.28, 0.02],
    radius: 0.17,       // outer die-cut radius
    border: 0.022,      // paper border round the foil disc
    lift: 0.008,        // how far it stands off the page
    bevel: 0.003,       // its cut edge rounds over this width
    line: 0.004,        // printed line width (ring, star)
    star: [0.07, 0.45], // star outer radius, inner ratio
  };
  // The notebook page: rules, margin, punched holes, and a still warp clear of the sticker.
  const PAGE = { warp: 0.004, freq: 2.2, clear: 0.03 };
  const NOTEBOOK = {
    rule: 0.05,         // ruled line spacing
    ruleTop: 0.32,      // no rules above this (the header gap)
    ruleInk: 0.28,      // ink coverage of a ruled line
    ruleLine: 0.0025,   // ruled line width
    margin: 0.2,        // margin line x, from the canvas's left edge (-0.6 ss at 960 x 600)
    marginInk: 0.4,     // its ink coverage
    holes: [0.09, 0.017, 0.12], // punched holes: x from the left edge (-0.71 ss at 960 x 600), radius, spacing in y
  };
  // Copied from bar 10: key, ambient, foil, pointer job, tilt.
  const KEY = { dir: [-0.6, 0.5, 0.62], level: 0.85, soft: 0.8 };
  const AMBIENT = 0.15;
  const FOIL = { spacing: 1.5, orders: 2, roughness: 0.3, tone: 0, pull: 0.3, target: "nearest" };
  const TILT = { max: 8, tau: 0.1 };
  const BIAS = 0.12;

  const sticker = fields.shape({
    writes: ["height", "coverage", "ink", "slot", "direction"],
    uniforms: {
      uC: STICKER.centre, uR: STICKER.radius, uBorder: STICKER.border, uLift: STICKER.lift, uBevel: STICKER.bevel,
      uLine: STICKER.line, uStar: STICKER.star,
      uWarp: PAGE.warp, uFreq: PAGE.freq, uClear: PAGE.clear,
      uRule: NOTEBOOK.rule, uRuleTop: NOTEBOOK.ruleTop, uRuleInk: NOTEBOOK.ruleInk, uRuleLine: NOTEBOOK.ruleLine,
      uMargin: NOTEBOOK.margin, uMarginInk: NOTEBOOK.marginInk, uHoles: NOTEBOOK.holes,
    },
    glsl: /* glsl */ `
uniform vec2 uC, uStar;
uniform vec3 uHoles; // not-colour: hole x, radius, spacing, ss
uniform float uR, uBorder, uLift, uBevel, uLine, uWarp, uFreq, uClear;
uniform float uRule, uRuleTop, uRuleInk, uRuleLine, uMargin, uMarginInk;
// A line of width w at distance d from its centre line, anti-aliased over one sheet texel.
float strokeW(float d, float w) {
  float aa = 1.0 / min(uRes.x, uRes.y);
  return 1.0 - smoothstep(0.5 * w - aa, 0.5 * w + aa, abs(d));
}
// Five-point star distance (Inigo Quilez's sdStar5), outer radius r, inner ratio rf.
float sdStar5(vec2 p, float r, float rf) {
  const vec2 k1 = vec2(0.809016994375, -0.587785252292);
  const vec2 k2 = vec2(-k1.x, k1.y);
  p.x = abs(p.x);
  p -= 2.0 * max(dot(k1, p), 0.0) * k1;
  p -= 2.0 * max(dot(k2, p), 0.0) * k2;
  p.x = abs(p.x);
  p.y -= r;
  vec2 ba = rf * vec2(-k1.y, k1.x) - vec2(0.0, 1.0);
  float h = clamp(dot(p, ba) / dot(ba, ba), 0.0, r);
  return length(p - ba * h) * sign(p.y * ba.x - p.x * ba.y);
}
float foilR() { return uR - uBorder; }
// The grooves' centre: seeded, inside the foil disc's inner half.
vec2 grooveC() {
  float a = 6.2831853 * hash11(uSeed + 3.0);
  float r = 0.5 * foilR() * hash11(uSeed + 7.0);
  return uC + r * vec2(cos(a), sin(a));
}
vec4 field(vec2 uv, vec2 q) {
  vec2 p = q - uC;
  float sd = length(p) - uR;
  if (sd > 0.0) {
    // The notebook page: punched holes (no surface), ruled lines and a margin printed in ink at low coverage.
    // Margin and holes are placed from the canvas's left edge, so a portrait view keeps them.
    float left = -0.5 * uRes.x / min(uRes.x, uRes.y);
    float hy = mod(q.y + 0.5 * uHoles.z, uHoles.z) - 0.5 * uHoles.z;
    if (length(vec2(q.x - (left + uHoles.x), hy)) < uHoles.y) return vec4(0.0, 0.0, 0.0, 0.0);
    float w = uWarp * (0.5 + 0.5 * fbm(q * uFreq + uSeed * 1.7, 3)) * smoothstep(0.0, uClear, sd);
    float ry = mod(q.y + 0.5 * uRule, uRule) - 0.5 * uRule;
    float ink = q.y < uRuleTop ? uRuleInk * strokeW(ry, uRuleLine) : 0.0;
    ink = max(ink, uMarginInk * strokeW(q.x - (left + uMargin), uRuleLine));
    return vec4(w, 1.0, ink, 0.0);
  }
  float rim = smoothstep(-uBevel, 0.0, sd);
  float h = uLift * (1.0 - rim * rim);
  float sf = length(p) - foilR();
  // The foil disc's printed edge ring, half on the border and half on the foil.
  float ink = strokeW(sf, uLine);
  if (sf > 0.0) return vec4(h, 1.0, ink, 1.0);
  // Inside the disc: foil, under a printed star outline turned by the seed.
  float a = 6.2831853 * hash11(uSeed + 13.0) / 5.0;
  mat2 rot = mat2(cos(a), -sin(a), sin(a), cos(a));
  ink = max(ink, strokeW(sdStar5(rot * p, uStar.x, uStar.y), uLine));
  return vec4(h, 1.0, ink, 2.0);
}
// Concentric grooves: along the circle about the grooves' centre; none outside the foil disc.
vec2 fieldDir(vec2 uv, vec2 q) {
  if (length(q - uC) > foilR()) return vec2(0.0);
  vec2 d = q - grooveC();
  float l = length(d);
  return l > 1e-5 ? vec2(-d.y, d.x) / l : vec2(1.0, 0.0);
}
`,
  });

  // The key's direction for a pointer offset m from the sticker's centre (ss), as bar 10 (bar 07's light job).
  const restH = Math.hypot(KEY.dir[0], KEY.dir[1]);
  const keyDir = (m) => {
    if (!m) return [...KEY.dir];
    const hx = (KEY.dir[0] / restH) * BIAS + m[0];
    const hy = (KEY.dir[1] / restH) * BIAS + m[1];
    const len = Math.hypot(hx, hy) || 1;
    return [(hx / len) * restH, (hy / len) * restH, KEY.dir[2]];
  };
  const lightsOf = (m) => [
    lights.key({ dir: keyDir(m), level: KEY.level, shadow: { soft: KEY.soft } }),
    lights.ambient(AMBIENT),
  ];

  const painter = paint(document.querySelector("canvas"), {
    seed: 1, // ?seed= overrides it (the engine reads the URL)
    detail: 0.6,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--sticker", "--accent-warm", "--accent-cool"] }),
    fields: [sticker, fields.text()],
    materials: [
      materials.paper({ tone: 0 }),
      materials.paper({ tone: 0.25 }),
      materials.foil({ spacing: FOIL.spacing, orders: FOIL.orders, roughness: FOIL.roughness, tone: FOIL.tone, pull: FOIL.pull, pullTarget: FOIL.target }),
    ],
    lights: lightsOf(null),
    pointer: { ease: easeOfTau(TILT.tau) },
    tilt: { max: TILT.max, drive: "pointer" },
  });
  window.painter = painter;

  // Layout: each row of words sits on a ruled line, right of the margin; the sticker's centre is where the light job
  // measures the pointer from.
  const ROWS = [
    { el: document.querySelector(".nb-row-0"), line: 0.2 },
    { el: document.querySelector(".nb-row-1"), line: 0.1 },
    { el: document.querySelector(".nb-row-2"), line: 0.05 },
  ];
  const TEXT_X = [NOTEBOOK.margin + 0.04, 0.06]; // the words' column: start from the left edge, end in ss
  const WORDS = { ".nb-title": 24, ".nb-date": 13 };
  const TYPE = [12, 13, 14, 16, 18, 20, 24, 32, 40, 48, 64];
  const typeStep = (px) => TYPE.filter((s) => s <= px).pop() ?? TYPE[0];
  const view = { side: 1, cx: 0, cy: 0 };
  function layout() {
    const side = Math.min(innerWidth, innerHeight);
    const toX = (x) => innerWidth / 2 + x * side;
    const toY = (y) => innerHeight / 2 - y * side;
    const u = side / 600;
    const x0 = -0.5 * innerWidth / side + TEXT_X[0];
    for (const { el, line } of ROWS) {
      Object.assign(el.style, {
        left: `${toX(x0)}px`, width: `${(TEXT_X[1] - x0) * side}px`,
        top: `${toY(line + NOTEBOOK.rule)}px`, height: `${NOTEBOOK.rule * side}px`,
      });
      el.style.setProperty("--u", String(u));
    }
    for (const [sel, px] of Object.entries(WORDS)) document.querySelector(sel).style.fontSize = `${typeStep(px * u)}px`;
    for (const el of document.querySelectorAll(".nb-line")) el.style.fontSize = `${typeStep(16 * u)}px`;
    Object.assign(view, { side, cx: toX(STICKER.centre[0]), cy: toY(STICKER.centre[1]) });
  }
  layout();
  addEventListener("resize", layout);

  // The light job's own motion, as bar 10: the key eases toward the pointer. Under reduced motion it goes straight
  // to the pointer (the page's only use of the media query).
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  const st = { m: null, target: null };
  let raf = 0;
  let last = 0;
  function tick(now) {
    raf = 0;
    if (!st.target) return;
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    const m = st.m ?? [0, 0];
    const k = reduced.matches ? 1 : 1 - Math.exp(-dt / TILT.tau);
    const next = [m[0] + (st.target[0] - m[0]) * k, m[1] + (st.target[1] - m[1]) * k];
    const busy = Math.hypot(st.target[0] - next[0], st.target[1] - next[1]) > 1e-4;
    st.m = busy ? next : [...st.target];
    painter.set({ lights: lightsOf(st.m) });
    if (busy) raf = requestAnimationFrame(tick);
    else last = 0;
  }
  addEventListener("pointermove", (e) => {
    st.target = [(e.clientX - view.cx) / view.side, (view.cy - e.clientY) / view.side];
    if (!raf) raf = requestAnimationFrame(tick);
  });
</script>
</body>
</html>
