<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paint-kit fault paper-small</title>
<!-- PLANTED PAGE (paper-small, checks fix round 2, 2026-11-15, review-checks-fix1 Minor 3): the range floor's
     under-1% branch, end to end. The sheet is one square patch of about 0.5% of the frame (0.09 short-side units a
     side, lower right), coverage 1, carrying a picture-ink ramp; everywhere else coverage is 0 and the page ground
     shows. The text is plain HTML (no paint ink) over that ground. With paint under text.rangePaintMin (1%) of the
     frame, the floor cannot judge it: text-contrast must report it partial in both schemes, named "not judged",
     never a pass. test/pages/paper.test.ts reads it. -->
<style>
  :root {
    --ground: oklch(0.94 0.015 85);
    --ink: oklch(0.24 0.03 260);
    --accent: oklch(0.68 0.12 60);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.26 0.015 260);
      --ink: oklch(0.92 0.02 85);
      --accent: oklch(0.74 0.11 60);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  main { position: relative; max-width: 34rem; padding: 40px 32px; }
  h1 { margin: 0 0 20px; font: 600 40px/1.15 Georgia, "Times New Roman", serif; letter-spacing: -0.01em; }
  p { margin: 0; font: 400 19px/1.55 Georgia, "Times New Roman", serif; letter-spacing: 0.01em; }
</style>
<script type="importmap">{"imports":{"paint-kit":"/dist/src/engine/index.js"}}</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<main>
  <h1>Night shift notes</h1>
  <p>The lamp on the rail decides what you can read. Words inside its pool sit
    sharp and black in the paper's fibres; words outside it sink back into the dark sheet until the light
    slides over them again. Move the lamp and the page reads differently.</p>
</main>
<script type="module">
  import { paint, fields, materials, lights, fromPage } from "paint-kit";

  // The page: coverage 1 on a ramp patch centred at q (0.55, -0.28) (y up), side 0.09; 0 elsewhere.
  const PATCH = /* glsl */ `
vec4 field(vec2 uv, vec2 q) {
  vec2 p = (q - vec2(0.55, -0.28)) / 0.09 + 0.5; // 0..1 across the patch
  bool inside = all(greaterThanEqual(p, vec2(0.0))) && all(lessThan(p, vec2(1.0)));
  return inside ? vec4(0.0, 1.0, p.x, 0.0) : vec4(0.0, 0.0, 0.0, 0.0);
}
`;
  const patch = fields.shape({ writes: ["coverage", "ink"], glsl: PATCH });

  paint(document.querySelector("canvas"), {
    seed: 1,
    detail: 0.6,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--accent"] }),
    fields: [patch],
    materials: [materials.paper()],
    lights: [
      lights.lamp({ at: [0.2, -0.05, 0.8], aim: [0.22, 0.3, 0], cone: 22, soft: 8, level: 0.115, kelvin: 2900 }),
      lights.ambient(0.95),
    ],
  });
</script>
</body>
</html>
