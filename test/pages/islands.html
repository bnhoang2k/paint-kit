<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paint-kit islands</title>
<!-- The islands test page: a grid of domed, glossy metal discs (material slot 0, sheen) drawn by one shape field
     with coverage, on a bare page. Between the discs the sheet has no surface (coverage 0), so the page ground
     shows, unlit. The light ground is brighter than any lit disc, so the frame's brightest 1% is a tie of ground
     pixels that cannot move with a light; the discs' own highlight does move. The relight highlight law must read
     the discs, not the ground (test/pages/relight.test.ts). Each disc's edge is anti-aliased over one texel either
     side, as bar 06's tiles are. Lights: a key from the upper left (light 0) and ambient (light 1). The tokens are
     this page's palette, light and dark. -->
<style>
  :root {
    --ground: oklch(0.95 0.015 85);
    --ink: oklch(0.22 0.03 260);
    --accent: oklch(0.45 0.03 240);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.2 0.02 255);
      --ink: oklch(0.93 0.02 85);
      --accent: oklch(0.55 0.04 240);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<script type="importmap">{"imports":{"paint-kit":"/dist/src/engine/index.js"}}</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<script type="module">
  import { paint, fields, materials, lights, fromPage } from "paint-kit";

  // Discs on a 5 x 3 grid, 0.2 short-side units apart, radius 0.07, each domed (a spherical cap 0.03 high), so a
  // key from any side lights the part that faces it.
  const discs = fields.shape({
    writes: ["height", "coverage", "slot"],
    uniforms: { uPitch: 0.2, uRadius: 0.07, uDome: 0.03 },
    glsl: /* glsl */ `
uniform float uPitch, uRadius, uDome;
vec4 field(vec2 uv, vec2 q) {
  vec2 grid = vec2(5.0, 3.0);
  vec2 p = q + 0.5 * grid * uPitch;
  vec2 id = floor(p / uPitch);
  if (any(lessThan(id, vec2(0.0))) || any(greaterThanEqual(id, grid))) return vec4(0.0, 0.0, 0.0, -1.0);
  vec2 local = p - (id + 0.5) * uPitch;
  float r = length(local) / uRadius;
  float aa = 1.0 / min(uRes.x, uRes.y);
  float cov = 1.0 - smoothstep(-aa, aa, length(local) - uRadius);
  if (cov <= 0.0) return vec4(0.0, 0.0, 0.0, -1.0);
  return vec4(uDome * (1.0 - min(r * r, 1.0)), cov, 0.0, 0.0);
}
`,
  });

  paint(document.querySelector("canvas"), {
    seed: 1,
    detail: 0.6,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--accent"] }),
    fields: [discs],
    materials: [materials.sheen({ roughness: 0.3 })],
    lights: [lights.key({ dir: [-0.45, 0.55, 0.7], level: 0.6 }), lights.ambient(0.3)],
  });
</script>
</body>
</html>
