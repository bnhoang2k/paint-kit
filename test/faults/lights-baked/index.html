<title>paint-kit lights</title>
<!-- PLANTED FAULT (lights-baked: the lamp is painted on). A copy of test/pages/lights.html with exactly one change; only the
     relight check should fail on it (test/pages/relight.test.ts).
     The lamp and glow test page: one sheet with a gentle warp, matte, a lamp hung above the upper middle and
     aimed down the page (light 0), a glow in the lower left (light 1) and ambient (light 2). Light settings
     here are mirrored in test/pages/lights.test.ts; change both together. The tokens below are this page's
     palette, for light and dark. -->
<style>
  :root {
    --ground: oklch(0.93 0.02 85);
    --ink: oklch(0.28 0.03 260);
    --accent: oklch(0.66 0.15 25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(0.32 0.02 260);
      --ink: oklch(0.93 0.02 85);
      --accent: oklch(0.72 0.14 30);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  h1 { position: relative; margin: 0; padding: 16px 24px; font: 600 20px/1.2 system-ui, sans-serif; }
</style>
<script type="importmap">{"imports":{"paint-kit":"/dist/src/engine/index.js"}}</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<h1>A lamp and a glow</h1>
<script type="module">
  import { paint, fields, materials, lights, fromPage } from "paint-kit";

  // The fault: a fake lamp. It declares the real lamp's props and law, but its GLSL adds a fixed radial gradient
  // over the colour, centred on the aim point, and it has no `with`: setLight and moveLight change only its props.
  const props = { at: [0.4, 0.1, 0.9], aim: [0.42, 0.45, 0], cone: 20, soft: 6, level: 1.1, kelvin: 3000 };
  const slide = (v, dx) => [v[0] + dx, v[1], v[2]];
  const baked = {
    id: "lamp",
    laws: ["falloff"],
    props,
    uniforms: {},
    testPositions: (step) => ({ at: slide(props.at, step ? 0.25 : 0), aim: slide(props.aim, step ? 0.25 : 0) }),
    glsl: `
LightSum light_$(Surf s, MatOut m) {
  float g = 1.0 - smoothstep(0.05, 0.42, length(s.q - vec2(-0.13, 0.05)));
  // Shading of the sheet's relief baked in from a fixed direction, so the page still moves as the sheet drifts.
  float shade = max(dot(s.n, normalize(vec3(0.02, 0.36, 0.93))), 0.0) / 0.93; // not-colour: a fixed light direction
  LightSum r;
  r.diffuse = vec3(0.0); // not-colour: the fake adds no light
  r.spec = mixOklab(uGround, uRamp[2], 0.25) * (0.9 * g * shade);
  return r;
}`,
  };

  paint(document.querySelector("canvas"), {
    seed: 1,
    palette: fromPage({ ground: "--ground", ink: "--ink", accents: ["--accent"] }),
    fields: [fields.sheet({ warp: 0.5 })],
    materials: [materials.matte()],
    lights: [
      baked,
      lights.glow({ at: [0.15, 0.8], radius: 0.2, level: 0.9, hues: "accents" }),
      lights.ambient(0.12),
    ],
  });
</script>
</body>
</html>
