<!doctype html>
<html lang="en" data-rung="2" data-look="quiet" data-motion="sleek">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paint-kit</title>
<meta name="description" content="Paint web surfaces in WebGL2 that take real light. Ten live bars: paper, denim, halftone, water, glass, foil, steel and fire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f3f1ec; --stage: #e7e4dd; --ink: #1d1c1a; --muted: #6d6a64; --line: #d8d4cb;
    --accent: #b5562c; --focus: #1d1c1a;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Instrument Serif", ui-serif, Georgia, serif;
    --gutter: clamp(16px, 4vw, 48px); --radius: 8px; --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #121211; --stage: #0b0b0a; --ink: #ecebe7; --muted: #8f8c86; --line: #2a2927; --accent: #e08a5a; --focus: #ecebe7; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); }
  a { color: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 var(--gutter); }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 28px 0 20px; }
  h1 { margin: 0; font: 400 clamp(40px, 6vw, 64px)/1 var(--serif); letter-spacing: -0.01em; }
  .tag { margin: 8px 0 0; color: var(--muted); max-width: 36em; }
  .gh { font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; transition: color 160ms ease; }
  .gh:hover { color: var(--ink); }

  /* The stage: the chosen bar, live. It keeps one size whatever bar it holds (on a phone, the bar's shape). */
  .stage { position: relative; height: min(72vh, 720px); min-height: 420px; background: var(--stage); border-radius: var(--radius); overflow: hidden; }
  /* Two frames at most: the bar on show, and the next one fading in over it once it has drawn. */
  .stage iframe { position: absolute; left: 50%; top: 50%; border: 0; display: block; background: transparent; opacity: 0;
    transform: translate(-50%, -50%) scale(calc(var(--s, 1) * 0.985)); transition: opacity 360ms var(--ease), transform 520ms var(--ease); }
  .stage iframe.in { opacity: 1; transform: translate(-50%, -50%) scale(var(--s, 1)); }
  .stage iframe.out { opacity: 0; transition-duration: 280ms; }

  .caption { display: grid; grid-template-columns: 1fr auto; gap: 4px 24px; padding: 16px 0 8px; min-height: 76px; }
  .caption h2 { margin: 0; font: 400 32px/1.1 var(--serif); }
  .caption p { margin: 0; color: var(--muted); grid-column: 1; max-width: 52em; }
  .caption .laws { grid-column: 2; grid-row: 1 / span 2; align-self: start; color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
  .tools { display: inline-flex; gap: 8px; margin: -6px -6px 0 8px; vertical-align: middle; }
  .tool { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--muted); transition: color 160ms ease, background-color 160ms ease; }
  .tool:hover { color: var(--ink); background: var(--stage); }
  .tool:disabled { opacity: 0.35; cursor: default; background: none; color: var(--muted); }
  .tool:focus-visible { outline: 1px solid var(--focus); outline-offset: 1px; }
  .tool svg { transition: transform 520ms var(--ease); }
  .tools { position: relative; }
  .tip { position: absolute; right: 0; top: 34px; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: var(--ground); font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transform: translateY(-2px); transition: opacity 160ms ease, transform 160ms var(--ease); z-index: 1; }
  #prev:is(:hover, :focus-visible) ~ #tip-prev, #next:is(:hover, :focus-visible) ~ #tip-next, #replay:is(:hover, :focus-visible) ~ #tip-replay, #open:is(:hover, :focus-visible) ~ #tip-open { opacity: 1; transform: none; }
  .tool.spin svg { transform: rotate(-360deg); }

  /* The strip: every bar as its clip, in one row that scrolls sideways inside itself. */
  /* Ten bars: five columns by two rows, so every one is in view and none sits alone on a row. */
  .strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px 16px; padding: 12px 0 40px; }
  .strip button { all: unset; cursor: pointer; display: grid; gap: 8px; min-width: 0; }
  .strip .thumb { aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: var(--stage); outline: 1px solid transparent; outline-offset: 3px; transition: outline-color 200ms ease; }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 520ms var(--ease); }
  .strip button:hover img { transform: scale(1.04); }
  .strip .name { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 160ms ease; }
  .strip button[aria-current="true"] .thumb { outline-color: var(--accent); }
  .strip button[aria-current="true"] .name, .strip button:hover .name { color: var(--ink); }
  .strip button:focus-visible .thumb { outline-color: var(--focus); }

  footer { border-top: 1px solid var(--line); padding: 20px 0 32px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  code { font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }

  /* The page arrives once: the title, then the stage, then the caption and strip. */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  header, .stage, .caption, .strip { animation: rise 640ms var(--ease) both; }
  .stage { animation-delay: 80ms; } .caption { animation-delay: 160ms; } .strip { animation-delay: 220ms; }

  @media (max-width: 640px) {
    header { flex-direction: column; gap: 8px; }
    .stage { min-height: 0; }
    .caption { grid-template-columns: 1fr; }
    .caption .laws { grid-column: 1; grid-row: auto; text-align: left; }
    .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .stage iframe { transform: translate(-50%, -50%) scale(var(--s, 1)); }
    .strip button:hover img { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>paint-kit</h1>
      <p class="tag">Surfaces for the web, painted in WebGL2, that take real light. Every bar here runs live.</p>
    </div>
    <a class="gh" href="https://github.com/bnhoang2k/paint-kit">Source on GitHub</a>
  </header>

  <main>
    <section class="stage" aria-label="Live bar"></section>
    <div class="caption" aria-live="polite">
      <h2 id="title"></h2>
      <p id="fits"></p>
      <span class="laws"><span id="laws"></span><span class="tools">
        <button class="tool" id="prev" type="button" aria-label="Previous bar" aria-describedby="tip-prev">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M8.5 3 4.5 7l4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="next" type="button" aria-label="Next bar" aria-describedby="tip-next">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M5.5 3l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="replay" type="button" aria-label="Start this bar again" aria-describedby="tip-replay">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2M2.5 2v2.5H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a class="tool" id="open" href="#" target="_blank" rel="noopener" aria-label="Open this bar on its own page" aria-describedby="tip-open">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M5 2H2.5A.5.5 0 0 0 2 2.5v9a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V9M8 2h4v4M12 2 6.5 7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <span class="tip" role="tooltip" id="tip-prev">Previous bar</span>
        <span class="tip" role="tooltip" id="tip-next">Next bar</span>
        <span class="tip" role="tooltip" id="tip-replay">Start again</span>
        <span class="tip" role="tooltip" id="tip-open">Open on its own page</span>
      </span></span>
    </div>
    <nav class="strip" id="strip" aria-label="Bars"></nav>
  </main>

  <footer>
    <span>paint-kit 0.1.0</span>
    <span>MIT licence</span>
  </footer>
</div>

<script>
  // Each bar: its folder, its name, what it does, and the light laws its gate checks.
  const BARS = [
    { id: "01-lamp-on-paper", name: "Lamp on paper", fits: "A lamp on a rail throws a cone on paper, and the words outside it sink into the dark. Day and night are one palette, lit two ways.", laws: "relief, falloff" },
    { id: "02-denim-zip", name: "Denim zip", fits: "Denim twill and a metal zip whose teeth catch the light as the pull comes down and the cloth opens.", laws: "relief, highlight", phone: true },
    { id: "03-halftone-resolve", name: "Halftone resolve", fits: "A picture that arrives as printed dots, coarse to fine, then a pale dot field darkens.", laws: "relief" },
    { id: "04-paper-shred", name: "Paper shred", fits: "A cut climbs the page with the scroll; the paper hangs as swaying strips, then lifts away.", laws: "relief" },
    { id: "05-pool-light", name: "Pool light", fits: "Water over the page: refraction, moving caustic lines, and a card that rises and bends with the waves.", laws: "caustic", phone: true },
    { id: "06-glimmer", name: "Glimmer", fits: "Frosted glass tiles lit from behind: a few glow, the rest stay dim and cool, and the lights follow the pointer.", laws: "transmit" },
    { id: "07-light-stamp", name: "Light stamp", fits: "An embossed stamp among paper scraps, lit by the pointer: the relief turns and the shadow falls away from the light.", laws: "relief, shadow" },
    { id: "10-foil-card", name: "Foil card", fits: "Holographic foil on a raised card that tilts toward the pointer, so the colour sweeps round the burst.", laws: "relief, shadow, iridescence" },
    { id: "11-heat-tint", name: "Heat tint", fits: "Temper colours on steel: blue, purple, brown and straw from a thin oxide film. The highlight slides with the light.", laws: "highlight, iridescence" },
    { id: "12-burn-card", name: "Burn card", fits: "A card that burns away in one go: a torn front, a hot rim, and glowing specks that cool.", laws: "burn, tint" },
  ];

  const stage = document.querySelector(".stage");
  const open = document.getElementById("open");
  const strip = document.getElementById("strip");
  const caption = document.querySelector(".caption");
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const narrow = matchMedia("(max-width: 640px)");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const pageOf = (b) => `bars/${b.id}/index.html`;
  const clipOf = (b, d) => `media/${b.id}-${b.id === "12-burn-card" || d ? "dark" : "light"}.webp`;
  const viewOf = (b) => (b.phone ? [393, 852] : [960, 600]);

  // The stage holds each bar at its own view (960 x 600, or a 393 x 852 phone), scaled to fit. On a phone the
  // stage takes the bar's own shape, since a fixed stage would leave a wide bar a thin band.
  function fit() {
    const [w, h] = viewOf(BARS[current]);
    stage.style.height = narrow.matches ? `${Math.min(innerHeight * 0.75, stage.clientWidth * h / w)}px` : "";
    const box = stage.getBoundingClientRect();
    stage.style.setProperty("--s", String(Math.min(1, box.width / w, box.height / h)));
  }

  // A bar is shown once it has drawn its first frame (window.__paint.ready), so the stage never goes blank:
  // the bar before it stays up until then, and fades out under it. A newer pick cancels an older one in flight.
  let current = 0, token = 0;
  function mount(b) {
    const mine = ++token;
    // A bar still loading for an older pick goes at once: at most the bar on show and this one hold a GL context.
    for (const old of stage.querySelectorAll("iframe:not(.in)")) old.remove();
    const [w, h] = viewOf(b);
    const f = document.createElement("iframe");
    f.title = b.name;
    f.style.width = `${w}px`;
    f.style.height = `${h}px`;
    f.src = pageOf(b);
    stage.append(f);
    const reveal = () => {
      if (mine !== token) return f.remove();
      for (const old of stage.querySelectorAll("iframe")) {
        if (old === f) continue;
        old.classList.remove("in");
        old.classList.add("out");
        setTimeout(() => old.remove(), still.matches ? 0 : 300);
      }
      requestAnimationFrame(() => f.classList.add("in"));
    };
    f.addEventListener("load", () => {
      const t0 = performance.now();
      (function wait() {
        if (mine !== token) return f.remove();
        let ready = true;
        try { ready = f.contentWindow.__paint?.ready === true; } catch {}
        if (ready || performance.now() - t0 > 4000) reveal();
        else requestAnimationFrame(wait);
      })();
    });
  }

  function show(i, animate) {
    const changed = i !== current || !stage.querySelector("iframe");
    current = i;
    const b = BARS[i];
    fit();
    mount(b);
    open.href = pageOf(b);
    if (!changed) return;
    document.getElementById("title").textContent = b.name;
    document.getElementById("fits").textContent = b.fits;
    document.getElementById("laws").textContent = b.laws;
    if (animate && !still.matches) caption.animate([{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 320, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
    for (const el of strip.children) el.setAttribute("aria-current", String(el.dataset.i === String(i)));
    history.replaceState(null, "", `#${b.id}`);
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === BARS.length - 1;
  }
  const step = (d) => {
    const i = Math.max(0, Math.min(BARS.length - 1, current + d));
    if (i !== current) show(i, true);
    return i;
  };
  document.getElementById("prev").addEventListener("click", () => step(-1));
  document.getElementById("next").addEventListener("click", () => step(1));

  BARS.forEach((b, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.i = String(i);
    btn.innerHTML = `<span class="thumb"><img alt="" loading="lazy"></span><span class="name"></span>`;
    btn.querySelector(".name").textContent = b.name;
    btn.querySelector("img").alt = `${b.name}, a short loop`;
    btn.addEventListener("click", () => { if (i !== current) show(i, true); });
    strip.append(btn);
  });
  const setClips = () => [...strip.querySelectorAll("img")].forEach((img, i) => { img.src = clipOf(BARS[i], dark.matches); });
  dark.addEventListener("change", setClips);
  setClips();

  // Start again: a fresh copy of the bar (the burn card burns once).
  const replay = document.getElementById("replay");
  replay.addEventListener("click", () => {
    show(current, false);
    if (still.matches) return;
    replay.classList.remove("spin");
    void replay.offsetWidth;
    replay.classList.add("spin");
  });
  replay.addEventListener("transitionend", () => replay.classList.remove("spin"));

  // The arrow keys step through the bars, unless a bar has the keys (it does once clicked: bar 01 moves its lamp).
  addEventListener("keydown", (e) => {
    if (e.altKey || e.metaKey || e.ctrlKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
    e.preventDefault();
    const i = step(e.key === "ArrowRight" ? 1 : -1);
    if (strip.contains(document.activeElement)) strip.children[i].focus({ preventScroll: true });
  });

  addEventListener("resize", fit);

  const start = BARS.findIndex((b) => `#${b.id}` === location.hash);
  current = start < 0 ? 0 : start;
  show(current, false);
</script>
</body>
</html>
